name: Release

# Run by hand from the Actions tab. It checks the version, builds the VSIX
# once, smoke tests that exact file on Linux, Windows and macOS, then publishes
# it and creates the v<version> tag and GitHub release on the same commit.
on:
  workflow_dispatch:
    inputs:
      pre_release:
        description: Publish as a pre-release (odd minor versions are pre-releases)
        type: boolean
        default: true
      publish_marketplace:
        description: Publish to the Visual Studio Marketplace
        type: boolean
        default: true
      publish_open_vsx:
        description: Publish to Open VSX
        type: boolean
        default: true
      publish_jetbrains:
        description: Publish the JetBrains plugin to JetBrains Marketplace
        type: boolean
        default: false
      dry_run:
        description: Dry run (verify, package and smoke test only, nothing is published or tagged)
        type: boolean
        default: false

# Only one release at a time, and a running release is never cancelled
# halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Require the default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Releases run from $DEFAULT_BRANCH only. This run was started from $REF."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Read the version
        id: version
        run: echo "version=$(node scripts/release/release-checks.mjs version)" >> "$GITHUB_OUTPUT"

      # Fails when the changelog has no dated section for this version, when
      # the tag already exists, or when a store already has this version.
      - name: Release checks
        env:
          PRE_RELEASE: ${{ inputs.pre_release }}
        run: node scripts/release/release-checks.mjs verify --pre-release "$PRE_RELEASE"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  package:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PRE_RELEASE: ${{ inputs.pre_release }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Package
        run: |
          args=(--out "packageawy-$VERSION.vsix")
          if [ "$PRE_RELEASE" = "true" ]; then args+=(--pre-release); fi
          npm run package -- "${args[@]}"

      - name: Check VSIX contents
        run: node scripts/integration/check-vsix-contents.mjs "packageawy-$VERSION.vsix"

      - name: SHA-256
        run: |
          sha256sum "packageawy-$VERSION.vsix" > "packageawy-$VERSION.vsix.sha256"
          cat "packageawy-$VERSION.vsix.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: |
            packageawy-${{ env.VERSION }}.vsix
            packageawy-${{ env.VERSION }}.vsix.sha256
          if-no-files-found: error

  # Installs the packaged VSIX into a clean VS Code and opens the dashboard,
  # the same check ci.yml runs, against the file that will be published.
  smoke:
    needs: [verify, package]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      VSCODE_TEST_VERSION: stable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Only @vscode/test-electron is used from node_modules.
      - name: Install
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vsix

      - name: VSIX install and dashboard smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a node scripts/integration/run-vsix-smoke.mjs "vsix/packageawy-$VERSION.vsix"

      - name: VSIX install and dashboard smoke test (Windows and macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: node scripts/integration/run-vsix-smoke.mjs "vsix/packageawy-$VERSION.vsix"

  publish:
    needs: [verify, smoke]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    # Add a required reviewer to this environment in the repository settings
    # to approve each release before anything is published.
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      VSIX: packageawy-${{ needs.verify.outputs.version }}.vsix
      PRE_RELEASE: ${{ inputs.pre_release }}

    steps:
      # Fails before anything is published when a chosen store has no token.
      - name: Check publish secrets
        env:
          PUBLISH_MARKETPLACE: ${{ inputs.publish_marketplace }}
          PUBLISH_OPEN_VSX: ${{ inputs.publish_open_vsx }}
          HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
          HAS_OVSX_PAT: ${{ secrets.OVSX_PAT != '' }}
        run: |
          missing=0
          if [ "$PUBLISH_MARKETPLACE" = "true" ] && [ "$HAS_VSCE_PAT" != "true" ]; then
            echo "::error::publish_marketplace is on but the VSCE_PAT secret is not set in the release environment."
            missing=1
          fi
          if [ "$PUBLISH_OPEN_VSX" = "true" ] && [ "$HAS_OVSX_PAT" != "true" ]; then
            echo "::error::publish_open_vsx is on but the OVSX_PAT secret is not set in the release environment."
            missing=1
          fi
          exit "$missing"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Gives npx the pinned @vscode/vsce from package-lock.json.
      - name: Install
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Confirm the tested VSIX
        run: sha256sum -c "$VSIX.sha256"

      # --skip-duplicate lets a re-run of this job continue past a store that
      # already took this version.
      - name: Publish to the Marketplace
        if: ${{ inputs.publish_marketplace }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          args=(publish --packagePath "$VSIX" --skip-duplicate)
          if [ "$PRE_RELEASE" = "true" ]; then args+=(--pre-release); fi
          npx vsce "${args[@]}"

      # ovsx reads the token from OVSX_PAT, so it stays off the command line.
      - name: Publish to Open VSX
        if: ${{ inputs.publish_open_vsx }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          args=(publish "$VSIX" --skip-duplicate)
          if [ "$PRE_RELEASE" = "true" ]; then args+=(--pre-release); fi
          npx --yes ovsx@1.3.0 "${args[@]}"

      # gh creates the tag on the dispatched commit along with the release.
      - name: Create the tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          {
            node scripts/release/release-checks.mjs notes "$VERSION"
            echo
            echo "VSIX SHA-256: \`$(cut -d ' ' -f 1 "$VSIX.sha256")\`"
          } > release-notes.md
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "$VSIX" "$VSIX.sha256" --clobber
          else
            args=("v$VERSION" "$VSIX" "$VSIX.sha256" --target "$TARGET" --title "v$VERSION" --notes-file release-notes.md)
            if [ "$PRE_RELEASE" = "true" ]; then args+=(--prerelease); fi
            gh release create "${args[@]}"
          fi

  jetbrains:
    needs: [verify, publish]
    if: ${{ inputs.publish_jetbrains && !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.verify.outputs.version }}

    steps:
      - name: Check publish secrets
        env:
          HAS_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN != '' }}
          HAS_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN != '' }}
          HAS_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY != '' }}
          HAS_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD != '' }}
        run: |
          missing=0
          for pair in "JETBRAINS_PUBLISH_TOKEN:$HAS_TOKEN" "JETBRAINS_CERTIFICATE_CHAIN:$HAS_CHAIN" \
                      "JETBRAINS_PRIVATE_KEY:$HAS_KEY" "JETBRAINS_PRIVATE_KEY_PASSWORD:$HAS_PASSWORD"; do
            if [ "${pair#*:}" != "true" ]; then
              echo "::error::publish_jetbrains is on but the ${pair%%:*} secret is not set in the release environment."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Read only, so nothing from a signing run is saved to the shared cache.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # The production bundles, the same build the VSIX ships.
      - name: Build the webview and sidecar
        run: |
          npm ci
          node esbuild.mjs --production

      - name: Require the real sidecar
        run: |
          if [ ! -f dist/sidecar.js ]; then
            echo "::error::dist/sidecar.js was not built. The release plugin must not bundle the stub sidecar."
            exit 1
          fi

      - name: Build and test
        working-directory: jetbrains
        run: ./gradlew build buildPlugin -Ppackageawy.stubSidecar=false

      # The configuration cache is off so the signing values are never written to disk.
      - name: Sign and publish
        working-directory: jetbrains
        env:
          JETBRAINS_PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
          JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin -Ppackageawy.stubSidecar=false --no-configuration-cache

      - name: Attach the plugin to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          zips=(jetbrains/build/distributions/*-signed.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected one signed plugin zip in jetbrains/build/distributions, found ${#zips[@]}."
            exit 1
          fi
          gh release upload "v$VERSION" "${zips[0]}" --clobber
