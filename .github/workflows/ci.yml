name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The only manual entry point for the JetBrains build too, so lint runs first.
  workflow_dispatch:

# A new push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  # Called rather than triggered on its own, so it waits for lint like the
  # VS Code jobs below.
  jetbrains:
    needs: lint
    uses: ./.github/workflows/jetbrains.yml

  check:
    needs: lint
    # Windows is not optional here: the lockfile parser handles path separators,
    # and npm resolves to npm.cmd on win32. Both are real bug sources.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 reached EOL; 22 is also what @vscode/vsce's own resolved
          # dependency tree (path-scurry, lru-cache, etc.) declares support
          # for going forward (see their package.json "engines" fields).
          node-version: 22
          cache: npm

      # `npm ci` installs exactly the committed lockfile and fails if
      # package.json and package-lock.json have drifted apart.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Disposable npm and pnpm project transactions
        run: npm run test:real-projects

      - name: Build
        run: npm run build

      # Packaging smoke check: vsce package fails on a missing required
      # manifest field, a broken .vscodeignore, or a build vscode:prepublish
      # can't reproduce. @vscode/vsce is a pinned devDependency (no global
      # tool, no publish credentials needed for `package`), so this is fully
      # deterministic and runs offline. This copy is discarded with the
      # runner. The package-vsix job builds the one the smoke tests install.
      - name: Package (smoke check)
        run: npm run package

  extension-host:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        vscode: [stable, 1.90.0]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The test scripts download VS Code into .vscode-test. Cache it per OS,
      # architecture and VS Code version so a new download happens only when
      # VS Code ships a release. stable is resolved to its version number
      # first, and every later step uses that number. Bump the v1 in the key
      # to throw away a bad cache entry.
      - name: Resolve VS Code version
        id: vscode
        shell: bash
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
        run: |
          version="$VSCODE_TEST_VERSION"
          if [ "$version" = stable ]; then
            for attempt in 1 2 3; do
              version=$(curl -fsSL --max-time 30 https://update.code.visualstudio.com/api/releases/stable \
                | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => console.log(JSON.parse(s)[0]));') \
                && [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && break
              version=""
              echo "Could not read the current stable VS Code version (attempt $attempt of 3)"
              [ "$attempt" = 3 ] || sleep 10
            done
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No VS Code version number for '$VSCODE_TEST_VERSION'"
            exit 1
          fi
          echo "Using VS Code $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .vscode-test/vscode-*
          key: vscode-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.vscode.outputs.version }}

      # Its own step so a network error or a broken install gets one retry
      # while a failing test below still fails the job. A cached install is
      # used without going online, so it is checked by running the VS Code
      # CLI with --version; if that fails the folder is deleted and VS Code is
      # downloaded again.
      - name: Download VS Code
        shell: bash
        env:
          VSCODE_TEST_VERSION: ${{ steps.vscode.outputs.version }}
        run: |
          node <<'EOF'
          const { spawnSync } = require('node:child_process');
          const fs = require('node:fs');
          const path = require('node:path');
          const { downloadAndUnzipVSCode, resolveCliArgsFromVSCodeExecutablePath } = require('@vscode/test-electron');

          const version = process.env.VSCODE_TEST_VERSION;
          const cacheDir = path.resolve('.vscode-test');

          // On Windows the CLI is a .cmd file, which cannot run without a shell, so
          // run what it runs: the VS Code executable as Node on the cli.js it names.
          function versionCommand(executable) {
            const [cli] = resolveCliArgsFromVSCodeExecutablePath(executable, { reuseMachineInstall: true });
            if (process.platform !== 'win32') return [cli, ['--version']];
            const script = /"%~dp0([^"]+\.js)"/.exec(fs.readFileSync(cli, 'utf8'))?.[1];
            if (!script) throw new Error(`No cli.js reference in ${cli}`);
            return [executable, [path.join(path.dirname(cli), script), '--version']];
          }

          function check(executable) {
            if (!fs.existsSync(executable)) throw new Error(`Missing ${executable}`);
            const [command, args] = versionCommand(executable);
            const result = spawnSync(command, args, {
              encoding: 'utf8',
              timeout: 120_000,
              windowsHide: true,
              env: { ...process.env, ELECTRON_RUN_AS_NODE: '1' },
            });
            const reported = (result.stdout ?? '').split(/\r?\n/)[0].trim();
            if (result.error || result.status !== 0 || reported !== version) {
              throw new Error(
                `VS Code --version printed "${reported}" (exit ${result.status}), expected ${version}. ${result.error ?? ''}${result.stderr ?? ''}`
              );
            }
          }

          function removeInstall() {
            const entries = fs.existsSync(cacheDir) ? fs.readdirSync(cacheDir) : [];
            for (const entry of entries) {
              if (entry.startsWith('vscode-') && entry.endsWith(`-${version}`)) {
                fs.rmSync(path.join(cacheDir, entry), { recursive: true, force: true });
              }
            }
          }

          (async () => {
            for (let attempt = 1; ; attempt++) {
              try {
                const executable = await downloadAndUnzipVSCode(version);
                check(executable);
                console.log(`VS Code ${version} is ready at ${executable}`);
                return;
              } catch (error) {
                console.error(error);
                removeInstall();
                if (attempt === 2) process.exit(1);
                console.log('Removed the VS Code install, downloading it again in 20 seconds');
                await new Promise((resolve) => setTimeout(resolve, 20_000));
              }
            }
          })();
          EOF

      # VS Code is an Electron application even though the assertions use its
      # Extension Host API, so Linux needs a virtual display.
      - name: Extension Host lifecycle and watcher tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension-host
        env:
          VSCODE_TEST_VERSION: ${{ steps.vscode.outputs.version }}

      - name: TEMP diagnostic, npm config on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node -p "process.execPath"
          npm config get globalconfig
          npm config get prefix
          npm config get userconfig
          Write-Output "APPDATA=$env:APPDATA"
          npm run --silent env 2>$null | Select-String -Pattern '^npm_config_(globalconfig|prefix|userconfig)='

      - name: Extension Host lifecycle and watcher tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:extension-host
        env:
          VSCODE_TEST_VERSION: ${{ steps.vscode.outputs.version }}

  # Builds the VSIX once so every smoke run below tests the same archive,
  # the one users would install, instead of a fresh build per runner.
  package-vsix:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Package
        run: npm run package

      # Reads the archive itself, not the working tree, and fails if a runtime
      # file is missing or if source maps, sources, tests or node_modules
      # slipped past .vscodeignore.
      - name: Check VSIX contents
        shell: bash
        run: node scripts/integration/check-vsix-contents.mjs packageawy-*.vsix

      # Only needed by the smoke jobs in this run, so keep it briefly.
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: packageawy-*.vsix
          if-no-files-found: error
          retention-days: 7

  # Installs the packaged VSIX with the VS Code CLI into an empty extensions
  # folder and opens the dashboard on a small npm project. The extension-host
  # job loads the repository instead, so it cannot catch a broken archive.
  # macOS is here because it has no other VS Code coverage in CI.
  vsix-smoke:
    needs: package-vsix
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        vscode: [stable, 1.90.0]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Only @vscode/test-electron is used from node_modules. The extension
      # under test comes from the downloaded VSIX, so nothing is built here.
      - name: Install
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vsix

      # The test scripts download VS Code into .vscode-test. Cache it per OS,
      # architecture and VS Code version so a new download happens only when
      # VS Code ships a release. stable is resolved to its version number
      # first, and every later step uses that number. Bump the v1 in the key
      # to throw away a bad cache entry.
      - name: Resolve VS Code version
        id: vscode
        shell: bash
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
        run: |
          version="$VSCODE_TEST_VERSION"
          if [ "$version" = stable ]; then
            for attempt in 1 2 3; do
              version=$(curl -fsSL --max-time 30 https://update.code.visualstudio.com/api/releases/stable \
                | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => console.log(JSON.parse(s)[0]));') \
                && [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && break
              version=""
              echo "Could not read the current stable VS Code version (attempt $attempt of 3)"
              [ "$attempt" = 3 ] || sleep 10
            done
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No VS Code version number for '$VSCODE_TEST_VERSION'"
            exit 1
          fi
          echo "Using VS Code $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .vscode-test/vscode-*
          key: vscode-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.vscode.outputs.version }}

      # Its own step so a network error or a broken install gets one retry
      # while a failing test below still fails the job. A cached install is
      # used without going online, so it is checked by running the VS Code
      # CLI with --version; if that fails the folder is deleted and VS Code is
      # downloaded again.
      - name: Download VS Code
        shell: bash
        env:
          VSCODE_TEST_VERSION: ${{ steps.vscode.outputs.version }}
        run: |
          node <<'EOF'
          const { spawnSync } = require('node:child_process');
          const fs = require('node:fs');
          const path = require('node:path');
          const { downloadAndUnzipVSCode, resolveCliArgsFromVSCodeExecutablePath } = require('@vscode/test-electron');

          const version = process.env.VSCODE_TEST_VERSION;
          const cacheDir = path.resolve('.vscode-test');

          // On Windows the CLI is a .cmd file, which cannot run without a shell, so
          // run what it runs: the VS Code executable as Node on the cli.js it names.
          function versionCommand(executable) {
            const [cli] = resolveCliArgsFromVSCodeExecutablePath(executable, { reuseMachineInstall: true });
            if (process.platform !== 'win32') return [cli, ['--version']];
            const script = /"%~dp0([^"]+\.js)"/.exec(fs.readFileSync(cli, 'utf8'))?.[1];
            if (!script) throw new Error(`No cli.js reference in ${cli}`);
            return [executable, [path.join(path.dirname(cli), script), '--version']];
          }

          function check(executable) {
            if (!fs.existsSync(executable)) throw new Error(`Missing ${executable}`);
            const [command, args] = versionCommand(executable);
            const result = spawnSync(command, args, {
              encoding: 'utf8',
              timeout: 120_000,
              windowsHide: true,
              env: { ...process.env, ELECTRON_RUN_AS_NODE: '1' },
            });
            const reported = (result.stdout ?? '').split(/\r?\n/)[0].trim();
            if (result.error || result.status !== 0 || reported !== version) {
              throw new Error(
                `VS Code --version printed "${reported}" (exit ${result.status}), expected ${version}. ${result.error ?? ''}${result.stderr ?? ''}`
              );
            }
          }

          function removeInstall() {
            const entries = fs.existsSync(cacheDir) ? fs.readdirSync(cacheDir) : [];
            for (const entry of entries) {
              if (entry.startsWith('vscode-') && entry.endsWith(`-${version}`)) {
                fs.rmSync(path.join(cacheDir, entry), { recursive: true, force: true });
              }
            }
          }

          (async () => {
            for (let attempt = 1; ; attempt++) {
              try {
                const executable = await downloadAndUnzipVSCode(version);
                check(executable);
                console.log(`VS Code ${version} is ready at ${executable}`);
                return;
              } catch (error) {
                console.error(error);
                removeInstall();
                if (attempt === 2) process.exit(1);
                console.log('Removed the VS Code install, downloading it again in 20 seconds');
                await new Promise((resolve) => setTimeout(resolve, 20_000));
              }
            }
          })();
          EOF

      - name: VSIX install and dashboard smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a node scripts/integration/run-vsix-smoke.mjs vsix/packageawy-*.vsix
        env:
          VSCODE_TEST_VERSION: ${{ steps.vscode.outputs.version }}

      - name: VSIX install and dashboard smoke test (Windows and macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: node scripts/integration/run-vsix-smoke.mjs vsix/packageawy-*.vsix
        env:
          VSCODE_TEST_VERSION: ${{ steps.vscode.outputs.version }}
